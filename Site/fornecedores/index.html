<style>
:root {
  --c-primary:      #1E3A7B;
  --c-primary-dark: #14264d;
  --c-accent:       #C1272D;
  --c-dark:         #23272E;
  --c-white:        #FFFFFF;
  --c-bg:           #F7F5F2;
  --c-n200:         #EDEAE4;
  --c-n400:         #9A9894;
  --c-n500:         #6C6B67;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --font-display: 'Archivo', sans-serif;
  --cw: 560px;
  --px: clamp(1.25rem, 4vw, 2rem);
  --r-sm: 0.625rem;
  --r-md: 1.25rem;
  --r-pill: 100px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--c-bg); color: var(--c-dark); min-height: 100vh; display: flex; flex-direction: column; }
.page-nav { background: var(--c-white); border-bottom: 1px solid var(--c-n200); padding: 1rem var(--px); display: flex; align-items: center; justify-content: center; }
.page-nav a { display: inline-flex; align-items: center; }
.page-nav img { height: 44px; width: auto; }
main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: clamp(2.5rem, 6vw, 5rem) var(--px); }
.page-header { text-align: center; max-width: 480px; margin-bottom: 2.5rem; }
.page-header .overline { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--c-accent); border: 1px solid rgba(0,0,0,0.15); border-radius: var(--r-pill); padding: 5px 14px; margin-bottom: 1rem; }
.page-header h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 3vw + 0.5rem, 2rem); font-weight: 600; color: var(--c-dark); line-height: 1.2; margin-bottom: 0.75rem; }
.page-header p { font-size: 0.95rem; color: var(--c-n500); line-height: 1.65; }
.form-card { background: var(--c-white); border-radius: var(--r-md); border: 1px solid var(--c-n200); padding: clamp(1.75rem, 4vw, 2.5rem); width: 100%; max-width: var(--cw); }
.form-grid { display: flex; flex-direction: column; gap: 1.1rem; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-n500); }
.form-group input, .form-group select, .form-group textarea { padding: 12px 14px; border: 1px solid var(--c-n200); border-radius: var(--r-sm); font-family: var(--font); font-size: 0.9375rem; color: var(--c-dark); background: var(--c-white); transition: border-color 0.2s; width: 100%; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--c-primary); }
.file-label { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed #CECDC8; border-radius: var(--r-sm); background: var(--c-bg); cursor: pointer; font-size: 0.875rem; color: var(--c-n500); transition: border-color 0.2s; }
.file-label:hover { border-color: var(--c-primary); }
input[type="file"] { display: none; }
.file-name { font-size: 0.8125rem; color: var(--c-n400); }
.form-submit { width: 100%; padding: 14px; background: var(--c-primary); color: var(--c-white); border: none; border-radius: var(--r-pill); font-family: var(--font-display); font-size: 0.9375rem; font-weight: 500; cursor: pointer; transition: background 0.2s, transform 0.15s; margin-top: 0.5rem; }
.form-submit:hover { background: var(--c-primary-dark); transform: translateY(-1px); }
.form-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.form-feedback { padding: 12px 16px; border-radius: var(--r-sm); font-size: 0.875rem; display: none; }
.form-feedback.success { background: #f0faf4; border: 1px solid #a3d9b1; color: #1a6b35; }
.form-feedback.error   { background: #fdf2f2; border: 1px solid #e8b4b4; color: #8a2020; }
.page-footer { text-align: center; padding: 2rem var(--px); font-size: 0.8rem; color: var(--c-n400); border-top: 1px solid var(--c-n200); }
.page-footer a { color: var(--c-primary); text-decoration: none; }
:focus-visible { outline: 3px solid var(--c-accent); outline-offset: 2px; }
@media (max-width: 600px) { .form-card { padding: 1.5rem 1.25rem; } }

<nav class="page-nav">
  <a href="/" aria-label="Gesso JW — Home">
    <img src="/assets/logos/logo-gesso-jw.svg" alt="Gesso JW" width="156" height="44">
  </a>
</nav>
<main>
  <header class="page-header">
    <span class="overline">Parceiros &amp; Fornecedores</span>
    <h1>Seja um fornecedor da Gesso JW</h1>
    <p>Cadastre sua empresa, produto ou serviço. Nossa equipe entrará em contato para avaliar a parceria.</p>
  </header>
  <div class="form-card">
    <form id="formFornecedor" class="form-grid" enctype="multipart/form-data">
      <input type="hidden" name="form_type" value="fornecedor">
      <div class="form-group">
        <label for="f-produto">Produto ou serviço oferecido</label>
        <input type="text" id="f-produto" name="produto" placeholder="Ex: Placas de drywall, perfis metálicos, locação de equipamentos…" required>
      </div>
      <div class="form-group">
        <label for="f-nome">Nome do responsável</label>
        <input type="text" id="f-nome" name="nome" placeholder="Seu nome completo" required>
      </div>
      <div class="form-group">
        <label for="f-empresa">Nome da empresa</label>
        <input type="text" id="f-empresa" name="empresa" placeholder="Razão social ou nome fantasia" required>
      </div>
      <div class="form-group">
        <label for="f-email">E-mail</label>
        <input type="email" id="f-email" name="email" placeholder="contato@empresa.com" required>
      </div>
      <div class="form-group">
        <label for="f-tel">Telefone / WhatsApp</label>
        <input type="tel" id="f-tel" name="telefone" placeholder="(11) 90000-0000" required>
      </div>
      <div class="form-group">
        <label>Proposta ou apresentação (opcional)</label>
        <label class="file-label" for="f-arquivo">
          📄 Anexar arquivo
          <span class="file-name" id="f-file-name">PDF, DOC ou DOCX · máx. 5 MB</span>
        </label>
        <input type="file" id="f-arquivo" name="arquivo" accept=".pdf,.doc,.docx">
      </div>
      <div class="form-feedback" id="f-feedback"></div>
      <button type="submit" class="form-submit" id="f-submit">Enviar cadastro</button>
    </form>
  </div>
</main>
<footer class="page-footer">
  <p>Gesso JW &copy; 2026 &nbsp;·&nbsp; <a href="/">Voltar ao site</a></p>
</footer>
<script>
(function () {
  var arq = document.getElementById('f-arquivo');
  if (arq) arq.addEventListener('change', function () {
    document.getElementById('f-file-name').textContent = this.files[0] ? this.files[0].name : 'PDF, DOC ou DOCX · máx. 5 MB';
  });
  var form = document.getElementById('formFornecedor');
  var btn = document.getElementById('f-submit');
  var feedback = document.getElementById('f-feedback');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Enviando…'; feedback.style.display = 'none';
    fetch('/form-handler.php', { method: 'POST', body: new FormData(form) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.success) {
          feedback.className = 'form-feedback success';
          feedback.textContent = 'Cadastro enviado! Entraremos em contato em breve.';
          feedback.style.display = 'block';
          form.reset();
          document.getElementById('f-file-name').textContent = 'PDF, DOC ou DOCX · máx. 5 MB';
        } else { throw new Error(d.message || 'Erro ao enviar.'); }
      })
      .catch(function (err) { feedback.className = 'form-feedback error'; feedback.textContent = err.message; feedback.style.display = 'block'; })
      .finally(function () { btn.disabled = false; btn.textContent = orig; });
  });
}());
</script>
</body>
